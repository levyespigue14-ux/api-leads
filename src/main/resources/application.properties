spring.application.name=api-leads

# Banco em memória para rodar sem instalar nada (dados somem ao reiniciar)
spring.datasource.url=jdbc:h2:mem:leads;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Em quantos dias depois da abordagem o follow-up vence
leads.dias-ate-followup=3

springdoc.swagger-ui.path=/swagger-ui.html
