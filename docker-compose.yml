services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: leads
      POSTGRES_USER: leads
      POSTGRES_PASSWORD: leads
    ports:
      - "5432:5432"
    volumes:
      - dados:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/leads
      DB_USER: leads
      DB_PASSWORD: leads
    ports:
      - "8080:8080"

volumes:
  dados:
